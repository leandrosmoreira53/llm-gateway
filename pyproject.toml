[project]
name = "llm-gateway"
version = "0.0.0"
description = "OpenAI-compatible LLM gateway that routes by cost per correct answer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leandro Moreira" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs hold illustrative snippets, not source code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # naming
    "S",            # bandit (security)
    "SIM",          # simplify
    "ASYNC",        # async pitfalls
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "bench", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls real paid APIs; run manually with `pytest -m live`",
]
